<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mortis Page Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><span class="mark">M</span><div><strong>MORTIS</strong><small>PAGE BRIDGE</small></div></header>
    <p id="connection" class="state">Checking desktop connection…</p>
    <section id="armed" class="page">No page armed.</section>
    <button id="arm" type="button">Arm this tab</button>
    <button id="disarm" class="secondary" type="button">Disarm</button>
    <p id="message" class="message"></p>
    <footer>Page text stays on this computer.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
